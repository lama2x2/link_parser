name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS обязателен: APFS/HFS+ отдают имена файлов в NFD (§13.2, 15a–15h)
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bare-urls]"
      - name: Тесты
        run: pytest -q
      - name: Покрытие parser.py и checkers/local.py (порог 90 %)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage run --source=mdlink -m pytest -q
          coverage report --include="mdlink/parser.py,mdlink/checkers/local.py" --fail-under=90

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Проверка собственной документации
        run: mdlink . --no-external --format json --output mdlink-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdlink-report
          path: mdlink-report.json
